    <style>
      /* Instant boot splash — plain HTML/CSS, renders before any JS or font */
      #boot {
        position: fixed;
        inset: 0;
        background: #0a0c11;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      #boot span {
        font-family: system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 30px;
        letter-spacing: -0.02em;
        color: #f1f3f8;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      @keyframes boot-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
    </style>
  </head>

  <body>
    <div id="root">
      <!-- Static splash: visible until React's first commit replaces it -->
      <div id="boot" aria-hidden="true"><span>TC<span style="color:#faaf2e">.</span></span></div>
    </div>
